# Runtime guardrail policy.
#
# Three of these settings are wrong. Your job in Module 4 is to find a set
# that contains the sleeper you built without breaking the four benign skills
# in the corpus.
#
# Each action takes: allow | warn | deny
#   allow  permit it, record it
#   warn   permit it, record it, mark the run as needing review
#   deny   refuse it before it happens, record the refusal

actions:
  # Writing into the directory the skill was loaded from.
  # This is mechanism 2. Nothing in either static scanner asks about it.
  skill_self_write: allow

  # Writing to standing-instruction files: AGENTS.md, CLAUDE.md and friends.
  # Read by every future session. This is the vector in m1-drive-sync.
  identity_file_write: allow

  # Outbound network from the agent or from a script it runs.
  network: allow

  # Running a script inside the skill directory.
  subprocess: allow

  # Writing anywhere else in the workspace.
  workspace_write: allow

# Files whose contents constitute the agent's effective instructions.
# Control 4 from the post: track local files, remote sources, and persistent
# self-written state. A digest is taken before and after every run.
instruction_surface:
  - "skill/**/SKILL.md"
  - "skill/**/*.md"
  - "AGENTS.md"
  - "CLAUDE.md"

# Control 1: bind the rating to a digest.
# Control 2: invalidate inherited approval when that digest changes.
on_surface_change: warn        # allow | warn | deny

# Hosts the skill may reach when `network` is not `deny`.
# Empty list means "any host", which is not a policy.
network_allowlist: []
